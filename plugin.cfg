# Plugins are registered in this file.
# Each line is: plugin_name:package_path
# The order of plugins determines the order they are executed in the chain.

# Core DNS functionality
trace:github.com/coredns/coredns/plugin/trace
log:github.com/coredns/coredns/plugin/log
errors:github.com/coredns/coredns/plugin/errors
panic:github.com/coredns/coredns/plugin/panic
health:github.com/coredns/coredns/plugin/health
ready:github.com/coredns/coredns/plugin/ready
prometheus:github.com/coredns/coredns/plugin/metrics
debug:github.com/coredns/coredns/plugin/debug
any:github.com/coredns/coredns/plugin/any
chaos:github.com/coredns/coredns/plugin/chaos

# Routing and forwarding
rewrite:github.com/coredns/coredns/plugin/rewrite
bind:github.com/coredns/coredns/plugin/bind
nsid:github.com/coredns/coredns/plugin/nsid
forward:github.com/coredns/coredns/plugin/forward
# Note: proxy plugin is deprecated in favor of forward; kept here for legacy config compatibility
proxy:github.com/coredns/coredns/plugin/proxy

# Zone data
file:github.com/coredns/coredns/plugin/file
auto:github.com/coredns/coredns/plugin/auto
secondary:github.com/coredns/coredns/plugin/secondary
hosts:github.com/coredns/coredns/plugin/hosts

# Service discovery
etcd:github.com/coredns/coredns/plugin/etcd
kubernetes:github.com/coredns/coredns/plugin/kubernetes

# Caching
cache:github.com/coredns/coredns/plugin/cache

# Utility
template:github.com/coredns/coredns/plugin/template
reload:github.com/coredns/coredns/plugin/reload
loadbalance:github.com/coredns/coredns/plugin/loadbalance
pprof:github.com/coredns/coredns/plugin/pprof
whoami:github.com/coredns/coredns/plugin/whoami
# Note: stub is superseded by forward with stub zone syntax in newer CoreDNS versions
stub:github.com/coredns/coredns/plugin/stub

# Personal additions
# acl plugin for restricting query access by source IP - useful for internal lab setup
# See: https://coredns.io/plugins/acl/
acl:github.com/coredns/coredns/plugin/acl

# geoip plugin for geo-based routing experiments (local testing only)
# See: https://coredns.io/plugins/geoip/
geoip:github.com/coredns/coredns/plugin/geoip
